<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tools</title>

    <style>
        :root {
            --bg: #f4efe6;
            --paper: #fffaf1;
            --text: #25211d;
            --muted: #746b61;
            --accent: #b23a48;
            --accent-2: #2d6a73;
            --border: #d8cfc2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;

            background:
                linear-gradient(
                    rgba(255, 255, 255, 0.18),
                    rgba(255, 255, 255, 0.18)
                ),
                var(--bg);

            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 720px;
            padding: clamp(28px, 6vw, 56px);

            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: 8px;

            box-shadow:
                0 18px 50px rgba(70, 55, 40, 0.10);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 4.8rem);
            line-height: 1;
            letter-spacing: -0.06em;
        }

        .intro {
            max-width: 560px;
            margin: 24px 0 36px;
            color: var(--muted);
            font-size: 1rem;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 12px;
        }

        a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            padding: 18px 20px;

            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 5px;

            text-decoration: none;
            font-weight: bold;

            transition:
                background 160ms ease,
                border-color 160ms ease,
                color 160ms ease,
                transform 160ms ease;
        }

        a::after {
            content: "→";
            color: var(--accent);
            font-size: 1.2rem;
        }

        a:hover,
        a:focus-visible {
            color: var(--accent-2);
            background: #ffffff;
            border-color: var(--accent-2);
            transform: translateX(4px);
        }

        a:focus-visible {
            outline: 3px solid rgba(45, 106, 115, 0.2);
            outline-offset: 3px;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);

            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 18px 12px;
            }

            main {
                padding: 28px 20px;
            }

            .intro {
                margin-bottom: 28px;
            }

            a {
                padding: 17px 16px;
            }
        }
    </style>
</head>

<body>

<main>
    <p class="eyebrow">AI</p>

    <h1>Tervetuloa!</h1>

    <p class="intro">
        Pieni kokoelma verkkoon sotkeutuneita asioita.
    </p>

    <nav aria-label="Päävalikko">
        <ul>
            <li>
                <a href="01-elementary-intro.html">Intro</a>
            </li>

<li>
    <a href="https://github.com/NinaLista/ProjektiLista"
       target="_blank"
       rel="noopener noreferrer">
        Projekteja
    </a>
</li>
        </ul>
    </nav>

    <footer>
        ※ 8/2026.
    </footer>
</main>

</body>
</html>
